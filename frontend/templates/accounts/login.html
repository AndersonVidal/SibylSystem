{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — SibylSystem</title>
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body class="login-page">

<main class="login-main">
    <div class="login-card">
        <h1 class="login-title">SibylSystem</h1>

        <form method="post" novalidate>
            {% csrf_token %}

            {% if form.non_field_errors %}
            <p class="login-error">Usuário ou senha incorretos.</p>
            {% endif %}

            <div class="form-group">
                <label for="{{ form.username.id_for_label }}">Usuário</label>
                {{ form.username }}
            </div>

            <div class="form-group">
                <label for="{{ form.password.id_for_label }}">Senha</label>
                {{ form.password }}
            </div>

            <button type="submit" class="btn btn-primary btn-full">Entrar</button>
        </form>
    </div>
</main>

</body>
</html>
